name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      apply_infra:
        description: "Apply Terraform infrastructure"
        required: true
        default: false
        type: boolean
      deploy_bundle:
        description: "Deploy Databricks bundle"
        required: true
        default: false
        type: boolean
      run_post_deploy_smoke:
        description: "Include post-deploy smoke verification instructions"
        required: true
        default: true
        type: boolean
      rollback_note:
        description: "Optional rollback/runbook note for this deployment"
        required: false
        default: ""
        type: string

jobs:
  plan-and-package:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release target and branch
        run: |
          python3 scripts/validate_release_request.py \
            --target ${{ inputs.target }} \
            --ref-name ${{ github.ref_name }} \
            --apply-infra ${{ inputs.apply_infra }} \
            --deploy-bundle ${{ inputs.deploy_bundle }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip install build

      - name: Build wheel
        run: python -m build

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init
        run: terraform -chdir=infra/terraform init

      - name: Validate Azure credentials
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          python3 scripts/validate_release_request.py \
            --target ${{ inputs.target }} \
            --ref-name ${{ github.ref_name }} \
            --apply-infra true \
            --check-env ARM_CLIENT_ID \
            --check-env ARM_CLIENT_SECRET \
            --check-env ARM_SUBSCRIPTION_ID \
            --check-env ARM_TENANT_ID

      - name: Terraform plan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform -chdir=infra/terraform plan \
            -var-file=env/${{ inputs.target }}.tfvars \
            -out=tfplan

      - name: Deployment summary
        run: |
          {
            echo "## Deployment Plan"
            echo "- Target: \`${{ inputs.target }}\`"
            echo "- Apply infrastructure: \`${{ inputs.apply_infra }}\`"
            echo "- Deploy bundle: \`${{ inputs.deploy_bundle }}\`"
            echo "- Post-deploy smoke verification: \`${{ inputs.run_post_deploy_smoke }}\`"
            echo "- Rollback note: \`${{ inputs.rollback_note }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export Terraform outputs
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform -chdir=infra/terraform output -json > /tmp/market-risk-tf-output.json || echo '{}' > /tmp/market-risk-tf-output.json
          python3 scripts/render_bundle_vars.py /tmp/market-risk-tf-output.json

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-risk-wheel-${{ inputs.target }}
          path: dist/*.whl

      - name: Upload Terraform output artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-risk-terraform-output-${{ inputs.target }}
          path: /tmp/market-risk-tf-output.json

  apply-infra:
    if: ${{ inputs.apply_infra }}
    runs-on: ubuntu-latest
    needs: plan-and-package
    environment: ${{ inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init
        run: terraform -chdir=infra/terraform init

      - name: Validate Azure credentials
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          python3 scripts/validate_release_request.py \
            --target ${{ inputs.target }} \
            --ref-name ${{ github.ref_name }} \
            --apply-infra true \
            --check-env ARM_CLIENT_ID \
            --check-env ARM_CLIENT_SECRET \
            --check-env ARM_SUBSCRIPTION_ID \
            --check-env ARM_TENANT_ID

      - name: Terraform apply
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform -chdir=infra/terraform apply -auto-approve -var-file=env/${{ inputs.target }}.tfvars

      - name: Apply summary
        if: ${{ success() }}
        run: echo "- Terraform apply succeeded for \`${{ inputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-databricks:
    if: ${{ inputs.deploy_bundle }}
    runs-on: ubuntu-latest
    needs: plan-and-package
    environment: ${{ inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: market-risk-wheel-${{ inputs.target }}
          path: dist

      - name: Download Terraform output artifact
        uses: actions/download-artifact@v4
        with:
          name: market-risk-terraform-output-${{ inputs.target }}
          path: /tmp

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Databricks credentials
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 scripts/validate_release_request.py \
            --target ${{ inputs.target }} \
            --ref-name ${{ github.ref_name }} \
            --deploy-bundle true \
            --check-env DATABRICKS_HOST \
            --check-env DATABRICKS_TOKEN

      - name: Render Databricks deploy command
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 scripts/deploy_bundle.py --target ${{ inputs.target }} --terraform-output-json /tmp/market-risk-tf-output.json

      - name: Databricks bundle validate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t ${{ inputs.target }}

      - name: Databricks summary
        if: ${{ success() }}
        run: |
          {
            echo "- Databricks bundle validate succeeded for \`${{ inputs.target }}\`"
            if [ "${{ inputs.run_post_deploy_smoke }}" = "true" ]; then
              echo "- Post-deploy smoke job contract: \`market-risk-post-deploy-smoke\`"
              echo "- Verification command: \`market-risk-verify-deployment\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
