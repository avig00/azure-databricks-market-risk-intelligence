bundle:
  name: azure-databricks-market-risk-intelligence

artifacts:
  platform_wheel:
    type: whl
    path: ..

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    artifacts:
      platform_wheel:
        dynamic_version: true
    variables:
      environment:
        default: dev
      catalog_name:
        default: finance_dev
      storage_backend:
        default: databricks
      adls_prefix:
        default: lakehouse/dev
      databricks_secret_scope:
        default: market-risk-scope
      fred_api_key_secret_key:
        default: fred-api-key
      cluster_policy_id:
        default: ""
      notification_email:
        default: ""

  prod:
    mode: production
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    artifacts:
      platform_wheel:
        dynamic_version: false
    variables:
      environment:
        default: prod
      catalog_name:
        default: finance_prod
      storage_backend:
        default: databricks
      adls_prefix:
        default: lakehouse/prod
      databricks_secret_scope:
        default: market-risk-scope
      fred_api_key_secret_key:
        default: fred-api-key
      cluster_policy_id:
        default: ""
      notification_email:
        default: ""

include:
  - resources/*.yml
