resources:
  jobs:
    market_risk_pipeline:
      name: market-risk-pipeline
      parameters:
        - name: market_risk_env
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: storage_backend
          default: ${var.storage_backend}
        - name: adls_prefix
          default: ${var.adls_prefix}
      tasks:
        - task_key: run_pipeline
          job_cluster_key: pipeline_cluster
          python_wheel_task:
            package_name: market-risk-platform
            entry_point: market-risk-run-all
            named_parameters:
              market_risk_env: "{{job.parameters.market_risk_env}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              storage_backend: "{{job.parameters.storage_backend}}"
              adls_prefix: "{{job.parameters.adls_prefix}}"
          libraries:
            - whl: ../dist/*.whl
      job_clusters:
        - job_cluster_key: pipeline_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
            spark_env_vars:
              MARKET_RISK_ENV: "{{job.parameters.market_risk_env}}"
              CONFIG_PROFILE: "{{job.parameters.market_risk_env}}"
              CATALOG_NAME: "{{job.parameters.catalog_name}}"
              STORAGE_BACKEND: "{{job.parameters.storage_backend}}"
              ADLS_PREFIX: "{{job.parameters.adls_prefix}}"
              DATABRICKS_SECRET_SCOPE: market-risk-scope
              FRED_API_KEY_SECRET_KEY: fred-api-key
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Chicago"
        pause_status: PAUSED

    market_risk_dashboard_refresh:
      name: market-risk-dashboard-refresh
      parameters:
        - name: market_risk_env
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: storage_backend
          default: ${var.storage_backend}
        - name: adls_prefix
          default: ${var.adls_prefix}
      tasks:
        - task_key: refresh_assets
          job_cluster_key: dashboard_cluster
          python_wheel_task:
            package_name: market-risk-platform
            entry_point: market-risk-dashboard-refresh
            named_parameters:
              market_risk_env: "{{job.parameters.market_risk_env}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              storage_backend: "{{job.parameters.storage_backend}}"
              adls_prefix: "{{job.parameters.adls_prefix}}"
          libraries:
            - whl: ../dist/*.whl
      job_clusters:
        - job_cluster_key: dashboard_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
            spark_env_vars:
              MARKET_RISK_ENV: "{{job.parameters.market_risk_env}}"
              CONFIG_PROFILE: "{{job.parameters.market_risk_env}}"
              CATALOG_NAME: "{{job.parameters.catalog_name}}"
              STORAGE_BACKEND: "{{job.parameters.storage_backend}}"
              ADLS_PREFIX: "{{job.parameters.adls_prefix}}"
      schedule:
        quartz_cron_expression: "0 15 6 * * ?"
        timezone_id: "America/Chicago"
        pause_status: PAUSED

    market_risk_simulation:
      name: market-risk-simulation
      parameters:
        - name: market_risk_env
          default: ${var.environment}
        - name: catalog_name
          default: ${var.catalog_name}
        - name: storage_backend
          default: ${var.storage_backend}
        - name: adls_prefix
          default: ${var.adls_prefix}
      tasks:
        - task_key: run_default_simulation
          job_cluster_key: simulation_cluster
          python_wheel_task:
            package_name: market-risk-platform
            entry_point: market-risk-simulate
            named_parameters:
              market_risk_env: "{{job.parameters.market_risk_env}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              storage_backend: "{{job.parameters.storage_backend}}"
              adls_prefix: "{{job.parameters.adls_prefix}}"
          libraries:
            - whl: ../dist/*.whl
      job_clusters:
        - job_cluster_key: simulation_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
            spark_env_vars:
              MARKET_RISK_ENV: "{{job.parameters.market_risk_env}}"
              CONFIG_PROFILE: "{{job.parameters.market_risk_env}}"
              CATALOG_NAME: "{{job.parameters.catalog_name}}"
              STORAGE_BACKEND: "{{job.parameters.storage_backend}}"
              ADLS_PREFIX: "{{job.parameters.adls_prefix}}"
