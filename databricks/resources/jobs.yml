resources:
  jobs:
    market_risk_pipeline:
      name: market-risk-pipeline
      tasks:
        - task_key: run_pipeline
          job_cluster_key: pipeline_cluster
          python_wheel_task:
            package_name: market-risk-platform
            entry_point: market-risk-run-all
          libraries:
            - whl: ../dist/*.whl
      job_clusters:
        - job_cluster_key: pipeline_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
      queue:
        enabled: true

    market_risk_dashboard_refresh:
      name: market-risk-dashboard-refresh
      tasks:
        - task_key: refresh_assets
          job_cluster_key: dashboard_cluster
          python_wheel_task:
            package_name: market-risk-platform
            entry_point: market-risk-dashboard-refresh
          libraries:
            - whl: ../dist/*.whl
      job_clusters:
        - job_cluster_key: dashboard_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1

    market_risk_simulation:
      name: market-risk-simulation
      tasks:
        - task_key: run_default_simulation
          job_cluster_key: simulation_cluster
          python_wheel_task:
            package_name: market-risk-platform
            entry_point: market-risk-simulate
          libraries:
            - whl: ../dist/*.whl
      job_clusters:
        - job_cluster_key: simulation_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
