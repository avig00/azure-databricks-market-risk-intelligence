              CATALOG_NAME: "{{job.parameters.catalog_name}}"
              STORAGE_BACKEND: "{{job.parameters.storage_backend}}"
              ADLS_PREFIX: "{{job.parameters.adls_prefix}}"
              DATABRICKS_SECRET_SCOPE: "{{job.parameters.databricks_secret_scope}}"
              FRED_API_KEY_SECRET_KEY: "{{job.parameters.fred_api_key_secret_key}}"
            policy_id: ${var.cluster_policy_id}
      schedule:
        quartz_cron_expression: "0 15 6 * * ?"
        timezone_id: "America/Chicago"
        pause_status: PAUSED

    market_risk_simulation:
      name: market-risk-simulation
      run_as:
        user_name: ${workspace.current_user.userName}
      parameters:
        - name: market_risk_env
          default: ${var.environment}
        - name: catalog_name
